services:
  - type: web
    name: epaper-harvester
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r ../requirements.txt && playwright install chromium
    startCommand: python -m harvester.cli serve
    healthCheckPath: /healthz
    envVars:
      - key: PORT
        value: 10000
      - key: PYTHON_VERSION
        value: "3.11"
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/.playwright
